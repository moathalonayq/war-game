<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>شاشة العرض - مسابقة المحينك</title>
<link rel="stylesheet" href="/shared/styles.css" />
<link rel="stylesheet" href="./display.css" />
</head>
<body>
<div class="container">
  <div id="joinBar" class="card">
    <h3>شاشة العرض</h3>
    <input id="roomCodeInput" placeholder="كود الغرفة" maxlength="4" style="text-transform:uppercase" />
    <button id="joinBtn">عرض</button>
  </div>

  <div id="gameArea" style="display:none">
    <h1 style="text-align:center">🏆 مسابقة المحينك</h1>
    <div id="questionBanner"></div>
    <div class="teams-row" id="teamsRow"></div>
  </div>

  <div id="finishArea" class="card" style="display:none">
    <h2>🎉 النتائج النهائية</h2>
    <ol id="rankingList"></ol>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/board.js"></script>
<script src="./display.js"></script>
</body>
</html>
