<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>واجهة الفريق - مسابقة المحينك</title>
<link rel="stylesheet" href="/shared/styles.css" />
<link rel="stylesheet" href="./team.css" />
</head>
<body>
<div class="container">
  <button id="leaveRoomBtn" style="position:absolute; top:20px; left:20px; z-index:1000; background:rgba(255,50,50,0.8); color:white; font-size:16px; border:none; border-radius:8px; padding:10px; cursor:pointer; display:none;" title="خروج من الغرفة">خروج</button>
  <h1>🎯 واجهة الفريق</h1>

  <div id="joinScreen" class="card">
    <h3>الانضمام إلى الغرفة</h3>
    <p>ادخل كود الغرفة الذي أعطاك إياه المدير</p>
    <input id="roomCodeInput" placeholder="كود الغرفة" maxlength="4" style="text-transform:uppercase; margin-bottom:8px" />
    <input id="teamSecretInput" placeholder="الرقم السري للفريق" style="margin-bottom:8px" />
    <button id="fetchTeamsBtn">بحث عن الفرق</button>
    <div id="teamSelectArea" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;"></div>
  </div>

  <div id="waitScreen" class="card" style="display:none">
    <h3>بانتظار بدء اللعبة...</h3>
    <p>الفريق: <span id="teamNameLabel"></span></p>
  </div>

  <div id="placementScreen" class="card" style="display:none">
    <h3>وزّع جيشك سرًا على الشبكة</h3>
    <div style="margin-bottom: 10px; display: flex; gap: 8px;">
      <button id="randomBtn" class="secondary" style="flex:1">توزيع عشوائي 🎲</button>
      <button id="clearBtn" class="danger" style="flex:1">مسح اللوحة 🗑️</button>
    </div>
    <div class="unit-picker" id="unitPicker"></div>
    <div id="placementGrid"></div>
    <div style="text-align:center;margin-top:16px">
      <button id="submitBoardBtn" disabled>تأكيد التوزيع</button>
    </div>
    <p id="placementMsg" style="text-align:center;color:#f87171"></p>
  </div>

  <div id="playScreen" class="card" style="display:none">
    <h3>الفريق: <span id="playTeamName"></span> | النقاط: <span id="playScore"></span></h3>
    
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/board.js"></script>
<script src="./team.js"></script>
</body>
</html>
