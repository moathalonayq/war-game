<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>واجهة الفريق - مسابقة المحينك</title>
<link rel="stylesheet" href="/shared/styles.css" />
<link rel="stylesheet" href="./team.css" />
</head>
<body>
<div class="container">
  <h1>🎯 واجهة الفريق</h1>

  <div id="joinScreen" class="card">
    <h3>الانضمام إلى الغرفة</h3>
    <p>ادخل كود الغرفة الذي أعطاك إياه المدير</p>
    <input id="roomCodeInput" placeholder="كود الغرفة" maxlength="4" style="text-transform:uppercase" />
    <button id="fetchTeamsBtn">بحث</button>
    <div id="teamSelectArea"></div>
  </div>

  <div id="waitScreen" class="card" style="display:none">
    <h3>بانتظار بدء اللعبة...</h3>
    <p>الفريق: <span id="teamNameLabel"></span></p>
  </div>

  <div id="placementScreen" class="card" style="display:none">
    <h3>وزّع جيشك سرًا على الشبكة</h3>
    <div class="unit-picker" id="unitPicker"></div>
    <div id="placementGrid"></div>
    <div style="text-align:center;margin-top:16px">
      <button id="submitBoardBtn" disabled>تأكيد التوزيع</button>
    </div>
    <p id="placementMsg" style="text-align:center;color:#f87171"></p>
  </div>

  <div id="playScreen" class="card" style="display:none">
    <h3>الفريق: <span id="playTeamName"></span> | النقاط: <span id="playScore"></span></h3>
    <div id="questionArea"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/board.js"></script>
<script src="./team.js"></script>
</body>
</html>
