<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>مسابقة المحينك - الرئيسية</title>
<link rel="stylesheet" href="/shared/styles.css" />
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  }
  .portal-container {
    text-align: center;
    background: #1e293b;
    padding: 40px;
    border-radius: 20px;
    border: 2px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    max-width: 600px;
    width: 90%;
  }
  .portal-container h1 {
    font-size: 3rem;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .portal-container p {
    color: #94a3b8;
    margin-bottom: 30px;
    font-size: 1.2rem;
  }
  .options-grid {
    display: grid;
    gap: 20px;
  }
  .portal-btn {
    display: block;
    text-decoration: none;
    background: #2563eb;
    color: white;
    padding: 20px;
    border-radius: 12px;
    font-size: 1.5rem;
    font-weight: bold;
    transition: all 0.3s;
    border: 2px solid transparent;
  }
  .portal-btn:hover {
    background: #1d4ed8;
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
  }
  .btn-admin { background: #059669; }
  .btn-admin:hover { background: #047857; box-shadow: 0 5px 15px rgba(5, 150, 105, 0.4); }
  .btn-display { background: #7c3aed; }
  .btn-display:hover { background: #6d28d9; box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4); }
  
  .portal-btn span {
    display: block;
    font-size: 1rem;
    font-weight: normal;
    color: #e2e8f0;
    margin-top: 5px;
  }
</style>
</head>
<body>

<div class="portal-container">
  <h1>🏆 مسابقة المحينك</h1>
  <p>أهلاً بك في منصة المسابقة، اختر وجهتك للبدء:</p>
  
  <div class="options-grid">
    <a href="/admin/" class="portal-btn btn-admin">
      👑 إدارة اللعبة
      <span>(إنشاء غرفة جديدة أو إدارة غرفة حالية)</span>
    </a>
    
    <a href="/team/" class="portal-btn">
      🎮 الدخول كفريق
      <span>(للانضمام كلاعب في الغرفة)</span>
    </a>
    
    <a href="/display/" class="portal-btn btn-display">
      🖥️ شاشة العرض
      <span>(شاشة الجمهور والنتائج)</span>
    </a>
  </div>
</div>

</body>
</html>
